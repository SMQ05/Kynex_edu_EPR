<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.42" stop-color="#1e3a8a"/>
      <stop offset="0.78" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <rect x="90" y="86" width="92" height="92" rx="24" fill="url(#brand)"/>
  <text x="136" y="152" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle">K</text>
  <text x="205" y="132" font-size="40" font-weight="800" fill="#ffffff">KynexEdu</text>
  <text x="206" y="166" font-size="20" font-weight="500" fill="#bae6fd">by Kynex Solutions</text>

  <!-- headline -->
  <text x="90" y="320" font-size="74" font-weight="900" fill="#ffffff">School Management</text>
  <text x="90" y="404" font-size="74" font-weight="900" fill="#67e8f9">System &amp; ERP</text>

  <!-- subhead -->
  <text x="92" y="466" font-size="30" font-weight="500" fill="rgba(255,255,255,0.9)">Pakistan's most complete cloud school ERP — all in one platform.</text>

  <!-- feature chips -->
  <g font-size="22" font-weight="600" fill="#ffffff">
    <rect x="90"  y="510" width="232" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)"/>
    <text x="206" y="546" text-anchor="middle">Online Admissions</text>
    <rect x="338" y="510" width="150" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)"/>
    <text x="413" y="546" text-anchor="middle">Fees</text>
    <rect x="504" y="510" width="200" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)"/>
    <text x="604" y="546" text-anchor="middle">Attendance</text>
    <rect x="720" y="510" width="170" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)"/>
    <text x="805" y="546" text-anchor="middle">Exams</text>
    <rect x="906" y="510" width="204" height="56" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)"/>
    <text x="1008" y="546" text-anchor="middle">WhatsApp</text>
  </g>

  <text x="1110" y="138" font-size="22" font-weight="600" fill="#bae6fd" text-anchor="end">edu.kynexsolutions.com</text>
</svg>
