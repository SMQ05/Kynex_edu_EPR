x-app-env: &app-env
  APP_NAME: ${APP_NAME:-KynexEdu ERP}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-warning}

  DB_CONNECTION: pgsql
  DB_HOST: sdyrimee6dszgvupw6hii471
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-kynexedu_central}
  DB_USERNAME: ${POSTGRES_USER:-kynexedu}
  DB_PASSWORD: ${POSTGRES_PASSWORD}

  TENANCY_DB_PREFIX: ${TENANCY_DB_PREFIX:-kynexedu_tenant_}
  TENANCY_DB_HOST: sdyrimee6dszgvupw6hii471
  TENANCY_DB_PORT: "5432"
  TENANCY_DB_USERNAME: ${POSTGRES_USER:-kynexedu}
  TENANCY_DB_PASSWORD: ${POSTGRES_PASSWORD}

  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
  CACHE_STORE: ${CACHE_STORE:-database}

  # Compile Blade views to a per-container path OUTSIDE the shared storage
  # volume, so concurrent workers/containers can't race-write a half-finished
  # compiled view. Pre-compiled on boot by docker/bootstrap.sh.
  VIEW_COMPILED_PATH: /var/www/html/bootstrap/cache/views
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-480}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_EXPIRE_ON_CLOSE: ${SESSION_EXPIRE_ON_CLOSE:-false}

  MAIL_MAILER: ${MAIL_MAILER:-resend}
  RESEND_API_KEY: ${RESEND_API_KEY}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@kynexsolutions.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-KynexEdu}

  SAAS_ADMIN_EMAIL: ${SAAS_ADMIN_EMAIL}
  SAAS_ADMIN_PASSWORD: ${SAAS_ADMIN_PASSWORD}

  FILAMENT_FILESYSTEM_DISK: ${FILAMENT_FILESYSTEM_DISK:-public}
  VITE_APP_NAME: ${APP_NAME:-KynexEdu ERP}

  DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo}

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: kynexedu-erp:coolify
  restart: unless-stopped
  volumes:
    - kynexedu_storage:/var/www/html/storage
  networks:
    - kynexedu_internal

services:
  app:
    <<: *app-base
    environment:
      <<: *app-env
      RUN_MIGRATIONS_AND_SEED: ${RUN_MIGRATIONS_AND_SEED:-true}
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.kynexedu-app.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app-base
    command: ["/usr/local/bin/start-queue"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS_AND_SEED: "false"
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app-base
    command: ["/usr/local/bin/start-scheduler"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS_AND_SEED: "false"
    depends_on:
      app:
        condition: service_started

volumes:
  kynexedu_storage:

networks:
  kynexedu_internal:
    driver: bridge
