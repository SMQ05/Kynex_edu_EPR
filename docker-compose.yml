services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kynexedu-erp:local
    container_name: kynexedu-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:80"
    environment:
      RUN_MIGRATIONS_AND_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  queue:
    image: kynexedu-erp:local
    container_name: kynexedu-queue
    restart: unless-stopped
    command: ["/usr/local/bin/start-queue"]
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS_AND_SEED: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage

  scheduler:
    image: kynexedu-erp:local
    container_name: kynexedu-scheduler
    restart: unless-stopped
    command: ["/usr/local/bin/start-scheduler"]
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS_AND_SEED: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: postgres:16-alpine
    container_name: kynexedu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kynexedu_central
      POSTGRES_USER: kynexedu
      POSTGRES_PASSWORD: kynexedu123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kynexedu -d kynexedu_central"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  app_storage:
  db_data:
