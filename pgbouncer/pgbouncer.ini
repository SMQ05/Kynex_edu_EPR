;; PgBouncer configuration for KynexEdu ERP
;; See docs/pgbouncer-setup.md for full setup instructions.

[databases]
;; Central database
kynexedu_central = host=127.0.0.1 port=5432 dbname=kynexedu_central

;; Tenant databases — wildcard match for all kynexedu_tenant_* databases
;; Each tenant school gets its own PostgreSQL database.
kynexedu_tenant_* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; CRITICAL: Session pooling is used for safety with RLS.
;; The app uses SET LOCAL app.user_role, which is technically safe
;; with transaction pooling. However, session mode provides a
;; defensive layer — if SET LOCAL is ever accidentally changed to
;; SET, transaction mode would silently leak roles between requests.
;; The throughput trade-off is acceptable for a school SaaS workload.
pool_mode = session

max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Reset session state when a server connection is returned to the pool.
;; DISCARD ALL clears temp tables, prepared statements, and session variables.
server_reset_query = DISCARD ALL
server_reset_query_always = 0

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Health check
server_check_query = SELECT 1
server_check_delay = 30
